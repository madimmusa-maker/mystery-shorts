name: Daily mystery short

on:
  schedule:
    # 10:00 UTC = 15:00 по Казахстану (UTC+5)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Загрузить на YouTube?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo apt-get install -y -qq fonts-montserrat || echo "Montserrat not available, using DejaVu"
          fc-cache -f >/dev/null

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload the short
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          SKIP_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload && 'true' || '' }}
        run: python main.py

      - name: Save video as artifact (if not uploaded)
        if: always() && steps.run.outputs.uploaded != 'true' && hashFiles('output/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Save topic history
        if: always() && hashFiles('history.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "History unchanged"
            exit 0
          fi
          git commit -m "Update topic history [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
